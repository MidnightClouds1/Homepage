---
- Media & Requests:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.yourdomain.com/
        description: Movies & TV
        server: unraid
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
          version: 2 # set to 1 if your Jellyfin is older than 10.12
          enableNowPlaying: true

    - Plex:
        icon: plex.png
        href: http://LAN_IP_HERE:32400/web
        description: Movies & TV
        server: unraid
        container: plex
        widgets:
          - type: plex
            url: http://plex:32400
            key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
          - type: tautulli # stacked here per your request instead of its own tile
            url: http://tautulli:PORT # confirm Tautulli's port + that it's on the `proxy` network
            key: "{{HOMEPAGE_VAR_TAUTULLI_API_KEY}}"

    - Youtarr:
        icon: youtarr.png
        href: https://youtarr.yourdomain.com/ # needs websocket-aware proxying in SWAG's subdomain conf
        description: YouTube channel downloader
        server: unraid
        container: youtarr

    - Seerr:
        icon: seerr.png
        href: https://seerr.yourdomain.com/ # confirm this is actually SWAG-proxied
        description: Media requests
        server: unraid
        container: seerr
        widget:
          type: seerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"

    - Tracearr:
        icon: tracearr.png
        href: http://LAN_IP_HERE:PORT/
        description: Active stream tracing
        server: unraid
        container: tracearr-supervised
        widget:
          type: tracearr
          url: http://tracearr-supervised:PORT
          key: "{{HOMEPAGE_VAR_TRACEARR_API_KEY}}"
          view: both

- Downloads & Automation:
    - qui:
        icon: qui.png
        href: http://LAN_IP_HERE:PORT/
        description: qBittorrent UI
        server: unraid
        container: qui

    - qBittorrent:
        icon: qbittorrent.png
        href: http://LAN_IP_HERE:8080/
        description: Torrent client
        server: unraid
        container: binhex-qbittorrentvpn
        widget:
          type: qbittorrent
          # binhex-qbittorrentvpn usually runs inside the VPN container's network
          # stack rather than joining `proxy` directly, so this uses the LAN IP to
          # be safe. If it's actually on `proxy`, this can become
          # http://binhex-qbittorrentvpn:8080 instead.
          url: http://LAN_IP_HERE:8080
          username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"

    - Prowlarr:
        icon: prowlarr.png
        href: http://LAN_IP_HERE:9696/
        description: Indexer manager
        server: unraid
        container: prowlarr
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"

    - Radarr:
        icon: radarr.png
        href: http://LAN_IP_HERE:7878/
        description: Movie management
        server: unraid
        container: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"

    - Sonarr:
        icon: sonarr.png
        href: http://LAN_IP_HERE:8989/
        description: TV management
        server: unraid
        container: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
          enableQueue: true

    - Shoko Server:
        icon: shoko.png
        href: http://LAN_IP_HERE:PORT/
        description: Anime library management
        server: unraid
        container: shoko-server

    - autobrr:
        icon: autobrr.png
        href: http://LAN_IP_HERE:PORT/
        description: Filter-based automation
        server: unraid
        container: autobrr
        widget:
          type: autobrr
          url: http://autobrr:PORT
          key: "{{HOMEPAGE_VAR_AUTOBRR_API_KEY}}"

    - Profilarr:
        icon: profilarr.png
        href: http://LAN_IP_HERE:PORT/
        description: "*arr profile/format management"
        server: unraid
        container: profilarr

    - qbit_manage:
        icon: qbit-manage.png
        href: http://LAN_IP_HERE:8181/ # only reachable if QBT_WEB_SERVER=true is set on this container — confirm
        description: qBittorrent housekeeping
        server: unraid
        container: qbit_manage

- Smart Home & Photos:
    - Home Assistant:
        icon: home-assistant.png
        href: https://ha.yourdomain.com/
        description: Home automation
        ping: HAOS_IP_HERE # HAOS is a VM, not a container, so there's no docker status dot for it
        widget:
          type: homeassistant
          url: http://HAOS_IP_HERE:8123
          key: "{{HOMEPAGE_VAR_HOMEASSISTANT_TOKEN}}"
          # Optional, up to 4 custom entity states — see chat summary for the syntax.
          # custom:
          #   - state: sensor.example_entity
          #     label: Example

    - Immich:
        icon: immich.png
        href: https://immich.yourdomain.com/
        description: Photo & video backup
        server: unraid
        container: immich_server
        widget:
          type: immich
          url: http://immich_server:2283
          key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
          version: 2 # set to 1 if your Immich is older than v1.118

- File Sharing:
    - Wizarr:
        icon: wizarr.png
        href: https://wizarr.yourdomain.com/
        description: Invite-based user onboarding
        server: unraid
        container: wizarr

    - Pingvin Share:
        icon: pingvin-share.png
        href: https://pingvin.yourdomain.com/
        description: File sharing
        server: unraid
        container: Pingvin-Share-X

- Network & Infra:
    - SWAG Dashboard:
        icon: swag.png
        href: http://LAN_IP_HERE:81/
        description: Reverse proxy dashboard
        server: unraid
        container: swag
        widget:
          type: swagdashboard
          url: http://swag:81 # hostname, not IP — avoids the past IP-drift breakage

    - Uptime Kuma:
        icon: uptime-kuma.png
        href: http://LAN_IP_HERE:PORT/ # confirm access is local-only as noted
        description: Service monitoring
        server: unraid
        container: UptimeKuma
        widget:
          type: uptimekuma
          url: http://UptimeKuma:PORT
          slug: STATUS_PAGE_SLUG_HERE # requires a public status page set up in Kuma first

    - Netronome:
        icon: netronome.png
        href: http://LAN_IP_HERE:PORT/
        description: Network speed testing
        server: unraid
        container: netronome

- Utilities:
    - The Lounge:
        icon: the-lounge.png
        href: http://LAN_IP_HERE:PORT/
        description: IRC client
        server: unraid
        container: thelounge

    - NextExplorer:
        icon: nextexplorer.png
        href: http://LAN_IP_HERE:PORT/
        description: File explorer
        server: unraid
        container: nextexplorer

    - Krusader:
        icon: krusader.png
        href: http://LAN_IP_HERE:PORT/
        description: File manager (admin only)
        server: unraid
        container: Krusader

    - Dev Manager:
        icon: dev-manager-desktop.png
        href: http://LAN_IP_HERE:5800/
        description: noVNC dev desktop (bridge network only)
        server: unraid
        container: dev-manager-desktop
